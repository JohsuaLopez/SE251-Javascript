<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event listener</title>
</head>
<body>
    <main>
        <button id="colorBtn">Change my color</button>

        <h2 id="header2">Interactive Heading</h2>

        <p id="paragraph">Interactive paragraph</p>

        <input type="text" id="username" placeholder="Enter your name">

        <button id="placeholderBTN">button</button>
    </main>
    <script>
        const colorButton = document.querySelector("#colorBtn");

        colorButton.addEventListener("click", function() {
            console.log("Button Clicked");

            colorButton.style.backgroundColor = "red";
        });

        colorButton.addEventListener("mouseover", function() {
            console.log("mouse on button");

            colorButton.style.backgroundColor = "blue";
        });
        
        colorButton.addEventListener("mouseout", function() {
            console.log("mouse off button");

            colorButton.style.backgroundColor = "gray";
        });


        const headingIT = document.querySelector("#header2");

        headingIT.addEventListener("click", function() {
            
            headingIT.style.color = "green"

        });

        headingIT.addEventListener("mouseover", function() {
            
            headingIT.style.color = "orange"

        });

         headingIT.addEventListener("mouseout", function() {
            
            headingIT.style.color = "gray"

        });

        const paraG = document.querySelector("#paragraph");

        paraG.addEventListener("click", function() {

            paraG.innerText = "lebron the goat"
        });

        paraG.addEventListener("mouseover", function() {

            paraG.innerText = "Jesus is Lord"
        });

        paraG.addEventListener("mouseout", function() {

            paraG.innerText = "Interactive paragraph"
        });

        const textbox = document.querySelector("#username");

        textbox.addEventListener("focus", function() {
            
            textbox.style.width = "300px";
        });

        textbox.addEventListener("blur", function() {
            
            textbox.style.width = "200px";
        });

        textbox.addEventListener("input", function() {
            
            textbox.value = textbox.value.toUpperCase();
        });

        const place = document.querySelector("#placeholderBTN");

        place.addEventListener("dblclick", function() {
            
            place.style.backgroundColor = "gold";
        });

        place.addEventListener("mouseleave", function() {
            
            place.style.backgroundColor = "gray";
        });

        place.addEventListener("click", function() {
            
            place.innerText = "You clicked this button"
        });

    </script>
</body>
